<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dani Santos — Professora de Canto e Coach Vocal</title>

    <meta
      name="description"
      content="Site oficial de Dani Santos, professora de canto e coach vocal. Conheça o Método Voz Livre, os cursos e sua trajetória com a música."
    />

    <!-- Fontes: Fraunces (display/headlines) + Inter (corpo/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tokens primeiro (variáveis), depois estilos base, depois responsivo -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <main>
      <!-- 1. Hero — fotografia editorial da Dani, frase de identidade, sem CTA -->
      <section id="hero" class="section" aria-label="Abertura"></section>

      <!-- 2. A Crença — desconstrução do mito do "desafinado", tipografia pura -->
      <section id="crenca" class="section" aria-label="A crença"></section>

      <!-- 3. A Transformação — coreografia tipográfica, 3 momentos emocionais -->
      <section
        id="transformacao"
        class="section"
        aria-label="A transformação"
      ></section>

      <!-- 4. Conheça a Dani — vídeo institucional sob demanda -->
      <section
        id="conheca-a-dani"
        class="section"
        aria-label="Conheça a Dani"
      ></section>

      <!-- 5. O Método — Método Voz Livre, composição integrada com a onda vocal -->
      <section id="metodo" class="section" aria-label="O método"></section>

      <!-- 6. Mini Prova Social — uma única citação, tratamento tipográfico -->
      <section
        id="mini-prova-social"
        class="section"
        aria-label="O que dizem sobre a Dani"
      ></section>

      <!-- 7. Escolha sua Jornada — apresentação comercial dos dois cursos -->
      <section
        id="escolha-sua-jornada"
        class="section"
        aria-label="Escolha sua jornada"
      ></section>

      <!-- 8. Depoimentos — carrossel "Vozes que encontraram seu caminho" -->
      <section
        id="depoimentos"
        class="section"
        aria-label="Depoimentos"
      ></section>

      <!-- 9. CTA Final — fechamento, eco da Hero, único botão -->
      <section
        id="cta-final"
        class="section"
        aria-label="Comece agora"
      ></section>
    </main>

    <!-- 10. Rodapé — identidade, WhatsApp, Instagram, copyright -->
    <footer id="rodape" class="section" aria-label="Contato"></footer>

    <script src="js/script.js" defer></script>
  </body>
</html>
